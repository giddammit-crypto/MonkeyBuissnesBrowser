name: Ubuntu release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src/**
      - scripts/**
      - .github/workflows/release.yml
permissions:
  contents: read
concurrency:
  group: ubuntu-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit
      - run: npm run build
      - run: npm run test:e2e:features
      - run: npm run test:e2e:smoke
      - run: npm run test:e2e:voodoo
      - run: npm run dist:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: REA packaged plugin audit
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/rea"
          npx -y rea-agents@6.8.0 analyze-javascript-application "$GITHUB_WORKSPACE/release/linux-unpacked/resources/app.asar" --source-path dist/main/services/extensions/LocalExtensionManager.js --source-path dist/main/services/adblock/FilterEngine.js --source-path dist/main/services/browsec/BrowsecService.js --max-semantic-nodes 10000 --max-semantic-nodes-per-file 4000 --max-semantic-unknowns 2000 --max-heap-mb 512 --analysis-timeout-ms 30000 --json > "$GITHUB_WORKSPACE/artifacts/rea/plugin-audit.json"
          node "$GITHUB_WORKSPACE/scripts/summarize-rea-audit.mjs" "$GITHUB_WORKSPACE/artifacts/rea/plugin-audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-packaged-plugin-audit
          path: artifacts/rea/
          if-no-files-found: ignore
      - name: Checksums
        working-directory: release
        run: sha256sum *.deb *.AppImage > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: soulm8te-ubuntu-x64
          path: |
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS
          if-no-files-found: error
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; preserving its assets."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "soulm8te ${version}" --notes-file "docs/RELEASE_${version}.md" release/*.deb release/*.AppImage release/SHA256SUMS
