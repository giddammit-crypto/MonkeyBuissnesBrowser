name: Browser checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:e2e:voodoo
      - run: npm run test:e2e:smoke
        env:
          SOUL_EVIDENCE_DIR: artifacts/ui-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-ui-evidence
          path: artifacts/ui-audit/
          if-no-files-found: ignore
      - run: npm audit --omit=dev
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
        if: matrix.os != 'ubuntu-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run dist:linux
        if: matrix.os == 'ubuntu-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: SOUL-M8TE-${{ matrix.os }}-unpacked
          path: |
            release/*unpacked/**
            release/mac*/**
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn
